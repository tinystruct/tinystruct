#logging.properties
logging.override = !TRUE
logging.level=INFO
logging.enabled=TRUE
handlers = java.util.logging.ConsoleHandler
# To also write log files, append the FileHandler:
# handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler

############################################################
# Handler specific properties.
# Describes specific configuration info for Handlers.
############################################################
java.util.logging.ConsoleHandler.level = FINE
java.util.logging.ConsoleHandler.formatter = org.tinystruct.system.logging.LogFormatter
java.util.logging.ConsoleHandler.encoding = UTF-8
# FileHandler: rotates across 5 files of 10 MB each (tinystruct-0.log ... tinystruct-4.log)
java.util.logging.FileHandler.pattern = logs/tinystruct-%g.log
java.util.logging.FileHandler.limit = 10485760
java.util.logging.FileHandler.count = 5
java.util.logging.FileHandler.level = INFO
java.util.logging.FileHandler.formatter = org.tinystruct.system.logging.LogFormatter
java.util.logging.FileHandler.encoding = UTF-8

org.tinystruct.valve.Watcher$LockEventListener.level=WARNING

mqtt.server.host=tcp://192.168.0.101
mqtt.server.port=1883

mcp.auth.token=123456
